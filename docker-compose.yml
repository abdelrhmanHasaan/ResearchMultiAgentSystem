version: "3.8"

services:
  app:
    build: .
    container_name: research_app
    ports:
      - "8679:8679"
    volumes:
      - .:/app
      - chroma_data:/app/chroma_db
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    networks:
      - research_network
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: research_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - research_network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  chroma_data:
  ollama_data:

networks:
  research_network:
    driver: bridge
