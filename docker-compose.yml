# Autonomous Research Platform - full stack
#
#   docker compose up -d --build                 # backend + frontend
#   docker compose --profile ollama up -d        # also run local Ollama
#
services:
  backend:
    build: ./backend
    container_name: research_backend
    ports:
      - "8679:8679"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-auto}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OLLAMA_BASE_URL=http://ollama:11434
      - RESEARCH_DATA_DIR=/app/data
      - RESEARCH_REPORTS_DIR=/app/reports
    volumes:
      - backend_data:/app/data
      - backend_reports:/app/reports
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: research_frontend
    working_dir: /app
    command: sh -c "npm install && npm run build && npx vite preview --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8679
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: research_ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Uncomment on GPU hosts:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  backend_data:
  backend_reports:
  ollama_data:
